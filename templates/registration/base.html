<!doctype html>
<html lang="ko"><head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0b111b">
  <title>{% block title %}계정{% endblock %} | theMemo</title>
  <style>:root{color-scheme:dark;--bg:#0b111b;--panel:#121b29;--line:#30435a;--text:#e8eef6;--muted:#aebdd0;--accent:#62d3ee;--danger:#ff9b9b}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at top,#173047 0,var(--bg) 48%);color:var(--text);font:16px/1.55 system-ui,sans-serif}.card{width:min(100%,420px);padding:clamp(24px,7vw,36px);border:1px solid var(--line);border-radius:18px;background:#121b29f2;box-shadow:0 22px 70px #0007}h1{margin:0 0 8px;font-size:28px}p{color:var(--muted)}form>p{margin:16px 0}label{display:block;margin:17px 0 6px;color:#dbe8f4;font-weight:650}input{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;background:#0d1520;color:var(--text);font:inherit}input:focus{outline:2px solid var(--accent);outline-offset:2px}.primary{width:100%;margin-top:22px;padding:12px;border:0;border-radius:9px;background:var(--accent);color:#071520;font:inherit;font-weight:750;cursor:pointer}.links{display:flex;justify-content:center;gap:15px;flex-wrap:wrap;margin:22px 0 0}.links a{color:var(--accent);text-underline-offset:3px}.errorlist{margin:7px 0;padding-left:20px;color:var(--danger)}.helptext{display:block;margin-top:6px;color:var(--muted);font-size:13px}.messages{list-style:none;padding:0}.messages li{padding:10px 12px;border:1px solid #287e6d;border-radius:8px;background:#123b36;color:#baf5e9}@media(max-width:480px){body{padding:14px}.card{border-radius:14px}}</style>
</head><body><main class="card">
  {% if messages %}<ul class="messages" aria-live="polite">{% for message in messages %}<li>{{ message }}</li>{% endfor %}</ul>{% endif %}
  {% block content %}{% endblock %}
</main></body></html>
