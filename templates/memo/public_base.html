{% load static %}{% static 'memo/' as memo_static %}<!doctype html><html lang="ko"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#0b111b"><title>{% block title %}공개 블로그{% endblock %} | theMemo</title>
{% for stylesheet in bundle_styles %}<link rel="stylesheet" href="{{ memo_static }}{{ stylesheet }}">{% endfor %}</head><body>
<header class="app-header"><a class="brand" href="{% url 'public-blog' %}"><span class="brand-mark">✦</span><span>theMemo</span><span class="brand-divider"></span><span class="brand-subtitle">공개 블로그</span></a><nav class="public-header-actions" aria-label="계정 메뉴">
{% if user.is_authenticated %}<a class="button secondary public-nav-button" href="{% url 'memo-app' %}">내 메모</a><a class="button primary public-nav-button" href="{% url 'new-note-entry' %}">새 글</a><a class="button ghost public-nav-button" href="{% url 'password-change' %}">{{ user.username }}</a>{% else %}<a class="button secondary public-nav-button" href="{% url 'login' %}">로그인</a><a class="button primary public-nav-button" href="{% url 'signup' %}">회원가입</a>{% endif %}
</nav></header><main class="public-main">{% block content %}{% endblock %}</main>
<script type="module" src="{{ memo_static }}{{ bundle_script }}"></script></body></html>
