<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}백오피스{% endblock %} | theMemo</title>
<style>
:root{color-scheme:dark;--bg:#0b111b;--panel:#151e2b;--line:#304258;--text:#e8eef6;--muted:#a8b7c9;--accent:#5cc8f5;--danger:#f18f99}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 system-ui,-apple-system,"Noto Sans KR",sans-serif}a{color:var(--accent);text-decoration:none}header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:24px;padding:14px 24px;background:#111a27;border-bottom:1px solid var(--line)}header strong{font-size:18px}nav{display:flex;gap:8px}nav a,.button{padding:8px 12px;border:1px solid var(--line);border-radius:7px;background:#1b2939;color:var(--text)}nav a[aria-current=page]{border-color:var(--accent);color:var(--accent)}main{max-width:1500px;margin:0 auto;padding:24px}.heading{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}.heading h1{margin:0;font-size:24px}.muted,small{color:var(--muted)}.messages{margin:0 auto;max-width:1500px;padding:14px 24px 0}.messages p{margin:0 0 8px;padding:9px 12px;border:1px solid #37556a;border-radius:7px;background:#17283a}.filterbar,.bulkbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:12px;background:var(--panel);border:1px solid var(--line);border-radius:9px;margin-bottom:12px}.filterbar{justify-content:flex-start}.bulkbar{position:sticky;bottom:0;z-index:4;box-shadow:0 -4px 18px #0004}input,select{min-height:36px;padding:7px 9px;border:1px solid #3a5068;border-radius:6px;background:#0f1825;color:var(--text)}input[type=checkbox]{min-height:0;width:16px;height:16px;accent-color:var(--accent)}button{font:inherit;cursor:pointer}.button{cursor:pointer}.button.primary{background:var(--accent);color:#082033;border-color:var(--accent);font-weight:700}.button.danger{color:#ffc2c7;border-color:#72464c}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:9px}table{width:100%;border-collapse:collapse;background:var(--panel);font-size:13px}th,td{padding:10px 11px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{background:#1b2939;color:#c8d6e5;white-space:nowrap}tbody tr:hover{background:#1a2736}.title-cell{min-width:220px;max-width:440px}.title-cell strong{display:block;overflow-wrap:anywhere}.title-cell small{display:block;margin-top:3px;max-height:42px;overflow:hidden}.badge{display:inline-block;padding:3px 7px;border:1px solid var(--line);border-radius:999px;white-space:nowrap}.badge.public{color:#80dbbb}.badge.trash{color:#f5a3a8}.pagination{display:flex;justify-content:center;align-items:center;gap:14px;padding:18px}.empty{padding:38px;text-align:center;color:var(--muted)}.explain{margin:0 0 14px;color:var(--muted)}.right{white-space:nowrap}.image-name{max-width:340px;overflow-wrap:anywhere}.size{white-space:nowrap}@media(max-width:700px){header{padding:11px 14px;gap:12px;flex-wrap:wrap}main{padding:16px 10px}.heading{align-items:flex-start;flex-direction:column}.title-cell{min-width:180px}.bulkbar{align-items:stretch}.bulkbar select{flex:1}}
</style></head><body>
<header><strong>theMemo 백오피스</strong><nav aria-label="백오피스 메뉴"><a href="{% url 'backoffice-notes' %}" {% if section == 'notes' %}aria-current="page"{% endif %}>메모 관리</a><a href="{% url 'backoffice-images' %}" {% if section == 'images' %}aria-current="page"{% endif %}>이미지 정리</a></nav><a class="right" href="{% url 'memo-app' %}">← 메모로</a></header>
{% if messages %}<div class="messages" role="status">{% for message in messages %}<p>{{ message }}</p>{% endfor %}</div>{% endif %}
<main>{% block content %}{% endblock %}</main>
<script>document.addEventListener('change',e=>{if(e.target.matches('[data-select-all]'))document.querySelectorAll('[name=selected]').forEach(c=>c.checked=e.target.checked)});document.addEventListener('submit',e=>{if(e.target.matches('[data-confirm]')&&!confirm(e.target.dataset.confirm))e.preventDefault()});</script>
</body></html>
